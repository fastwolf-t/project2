[project]
name = "project2"
version = "0.1.0"
description = ""
authors = [
    {name = "fastwolf-t"}
]
license = "unlicense"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.4.1,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "poethepoet (>=0.49.0,<0.50.0)"
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.poe]
verbosity = -1

[tool.poe.tasks.check]
sequence = [
  { cmd = "python -c \"print('checking for non-installed packages...')\"" },
  { cmd = "mypy src --install-types --non-interactive", env = { MYPYPATH = "src" } },
  { cmd = "python -c \"print('black running...')\"" },
  { cmd = "black src" },
  { cmd = "python -c \"print('isort running...')\"" },
  { cmd = "isort src" },
  { cmd = "python -c \"print('flake8 running...')\"" },
  { cmd = "flake8 src" },
  { cmd = "python -c \"print('mypy running...')\"" },
  { cmd = "mypy src tests", env = { MYPYPATH = "src" } }
]